<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX EA Radar</title>
<!-- inline SVG favicon: a radar sweep over a rising bar, no external file to fetch -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23020617'/%3E%3Cpath d='M16 16 L27 8' stroke='%2322C55E' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%231E3A5F' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='none' stroke='%231E3A5F' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%2322C55E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── design tokens (Dark Mode OLED, dense dashboard) ───────────────────── */
:root {
  --color-background: #020617;
  --color-surface:    #0E1223;
  --color-surface-2:  #151B2E;
  --color-muted:      #1A1E2F;
  --color-foreground: #F8FAFC;
  --color-muted-fg:   #94A3B8;
  --color-border:     #334155;
  --color-border-soft:#232C3D;
  --color-accent:     #22C55E;
  --color-on-accent:  #0F172A;
  --color-info:       #60A5FA;
  --color-warn:       #FBBF24;
  --color-destructive:#EF4444;
  --color-ring:       #FFFFFF;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px;
  --radius-sm: 4px; --radius: 8px; --radius-lg: 12px; --radius-full: 999px;
  --font-head: 'Fira Code', ui-monospace, Consolas, monospace;
  --font-body: 'Fira Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5);
  --shadow-2: 0 4px 16px rgba(0,0,0,.45);
  --dur: 200ms; --ease: cubic-bezier(.2,.6,.3,1);
  --z-sticky: 40; --z-modal: 100;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur: 1ms; }
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--color-background); color: var(--color-foreground);
  font: 400 16px/1.55 var(--font-body); overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; letter-spacing: -.01em; }
a { color: var(--color-info); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; border-radius: var(--radius-sm); }
.num { font-family: var(--font-head); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg { flex: none; }

/* ── app bar ───────────────────────────────────────────────────────────── */
.appbar { position: sticky; top: 0; z-index: var(--z-sticky);
  background: color-mix(in srgb, var(--color-background) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--color-border-soft); }
.appbar__row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
  padding: var(--space-3) var(--space-4); max-width: 1600px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-head);
  font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.brand svg { color: var(--color-accent); }

.search[hidden] { display: none; }   /* same [hidden] vs display:flex trap as .toolbar */
.search:not([hidden]) { position: relative; flex: 1 1 260px; min-width: 180px; display: flex; align-items: center; }
.search svg { position: absolute; left: 10px; color: var(--color-muted-fg); pointer-events: none; }
input[type="search"] { width: 100%; padding: 8px 10px 8px 34px; background: var(--color-surface);
  color: var(--color-foreground); border: 1px solid var(--color-border);
  border-radius: var(--radius); font: 400 14px/1.4 var(--font-body); }
input[type="search"]::placeholder { color: var(--color-muted-fg); }
select { padding: 8px 10px; background: var(--color-surface); color: var(--color-foreground);
  border: 1px solid var(--color-border); border-radius: var(--radius);
  font: 400 13px/1.3 var(--font-body); cursor: pointer; }

.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 7px 12px;
  cursor: pointer; background: var(--color-surface); color: var(--color-foreground);
  border: 1px solid var(--color-border); border-radius: var(--radius);
  font: 500 13px/1.2 var(--font-body);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.btn:hover { background: var(--color-surface-2); border-color: var(--color-muted-fg); }
.btn[aria-pressed="true"] { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }
.btn--primary { background: var(--color-accent); color: var(--color-on-accent);
  border-color: var(--color-accent); font-weight: 600; }
.btn--primary:hover { background: color-mix(in srgb, var(--color-accent) 85%, #fff); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.segmented { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden; }
.segmented .btn { border: 0; border-radius: 0; min-height: 34px; }
.segmented .btn + .btn { border-left: 1px solid var(--color-border); }

/* [hidden] must win: a bare `display:flex` on the class outranks the UA rule,
   which is what kept the EA filter bar visible on the MT5 tab. */
.toolbar[hidden] { display: none; }
.toolbar:not([hidden]) { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  padding: 0 var(--space-4) var(--space-3); max-width: 1600px; margin: 0 auto; }
.toolbar__spacer { flex: 1 1 auto; }
.fgroup { display: inline-flex; align-items: center; border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-full); overflow: hidden; }
.fgroup .chip { border: 0; border-radius: 0; }
.fgroup .chip + .chip { border-left: 1px solid var(--color-border-soft); }
.fdiv { width: 1px; height: 22px; background: var(--color-border-soft); }

.chip[hidden] { display: none; }   /* [hidden] must beat display:inline-flex */
.chip:not([hidden]) { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; min-height: 30px;
  padding: 4px 11px; background: var(--color-surface); color: var(--color-muted-fg);
  border: 1px solid var(--color-border-soft); border-radius: var(--radius-full);
  font: 500 12.5px/1.2 var(--font-body);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.chip:hover { color: var(--color-foreground); border-color: var(--color-muted-fg); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--color-info) 18%, var(--color-surface));
  border-color: var(--color-info); color: var(--color-foreground); }

.popover { position: relative; }
.popover > summary { list-style: none; cursor: pointer; }
.popover > summary::-webkit-details-marker { display: none; }
.popover > summary::after { content: ''; width: 0; height: 0; margin-left: 2px;
  border: 4px solid transparent; border-top-color: currentColor; translate: 0 2px; }
.popover[open] > summary { border-color: var(--color-info); color: var(--color-foreground); }
.popover__panel { position: absolute; z-index: var(--z-modal); top: calc(100% + 6px); left: 0;
  width: 260px; max-height: 320px; overflow: auto; padding: var(--space-2); display: grid; gap: 2px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius); box-shadow: var(--shadow-2); }
.tagopt { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; padding: 5px 8px;
  border-radius: var(--radius-sm); font-size: 13px; color: var(--color-muted-fg); }
.tagopt:hover { background: var(--color-surface-2); color: var(--color-foreground); }
.tagopt input { accent-color: var(--color-accent); width: 15px; height: 15px; cursor: pointer; }
.tagopt[data-on="true"] { color: var(--color-foreground); }
.tagopt .n { margin-left: auto; font-family: var(--font-head); font-size: 11px; opacity: .7; }

.syncbox[hidden] { display: none; }   /* [hidden] must beat display:inline-flex */
.syncbox:not([hidden]) { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
  border: 1px solid var(--color-border-soft); border-radius: var(--radius-full);
  font-size: 12px; color: var(--color-muted-fg); white-space: nowrap; }
.syncbox .led { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); flex: none; }
.syncbox .led--run { background: var(--color-warn); animation: pulse 1.4s ease-in-out infinite; }
.syncbox .led--err { background: var(--color-destructive); }
.syncbox .led--old { background: var(--color-muted-fg); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

.status { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
  font-size: 12.5px; color: var(--color-muted-fg); }
.status b { color: var(--color-foreground); font-family: var(--font-head); font-variant-numeric: tabular-nums; }
.status .warn { color: var(--color-warn); }

/* ── grid + cards ──────────────────────────────────────────────────────── */
main { max-width: 1600px; margin: 0 auto; padding: var(--space-4); }
.grid { columns: 340px; column-gap: var(--space-3); }   /* masonry: equal rows leave gaps */
.grid > * { break-inside: avoid; margin-bottom: var(--space-3); }
.grid--list { columns: auto; }

.card { display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3) var(--space-4); background: var(--color-surface);
  border: 1px solid var(--color-border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
.card__head { display: flex; align-items: flex-start; gap: var(--space-2); }
.card__title { flex: 1; margin: 0; font-size: 14px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card__meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 0;
  font-size: 11.5px; color: var(--color-muted-fg); }
.card__meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--color-border); }
.actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.spec-inline { display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: 12px; color: var(--color-muted-fg); }
.spec-inline b { color: var(--color-foreground); font-family: var(--font-head);
  font-variant-numeric: tabular-nums; font-weight: 500; }

.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: var(--radius-full); border: 1px solid var(--color-border-soft);
  background: var(--color-muted); font: 500 11.5px/1.5 var(--font-body);
  color: var(--color-muted-fg); white-space: nowrap; }
.badge--ver  { border-color: var(--color-accent); color: #86EFAC; font-family: var(--font-head); }
.badge--pair { border-color: color-mix(in srgb, var(--color-info) 60%, transparent); color: #BFDBFE; font-family: var(--font-head); }
.badge--tf   { border-color: color-mix(in srgb, var(--color-warn) 55%, transparent); color: #FDE68A; font-family: var(--font-head); }
.badge--risk { border-color: var(--color-destructive); color: #FCA5A5; }
.badge--pass { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 18%, var(--color-muted)); color: #86EFAC; }
.badge--loss { border-color: var(--color-destructive); background: color-mix(in srgb, var(--color-destructive) 16%, var(--color-muted)); color: #FCA5A5; }
.badge--scam { border-color: var(--color-destructive); background: color-mix(in srgb, var(--color-destructive) 32%, var(--color-muted)); color: #FEE2E2; }
.badge--none { border-color: var(--color-border); color: var(--color-muted-fg); }
.badge--run  { border-color: var(--color-warn); color: #FDE68A; }

.shot-none { color: var(--color-border); font-size: 12px; }
.tlinks { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.tlink { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; min-height: 26px;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  color: var(--color-info); font: 500 11.5px/1.2 var(--font-body); white-space: nowrap; }
.tlink:hover { background: var(--color-surface-2); border-color: var(--color-info); text-decoration: none; }

/* no blanket `details` border - the Tags popover is a <details> and would draw a
   stray rule above the chip */
summary { display: flex; align-items: center; gap: 6px; cursor: pointer;
  font: 500 12.5px/1.3 var(--font-body); color: var(--color-muted-fg); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary:hover { color: var(--color-foreground); }
summary svg { transition: transform var(--dur) var(--ease); }
details[open] > summary svg { transform: rotate(90deg); }
.rules { margin: var(--space-2) 0 0; padding-left: 18px; font-size: 12.5px; color: #CBD5E1; }
.rules li { margin-bottom: 3px; }
pre.raw { margin: var(--space-2) 0 0; padding: var(--space-3); background: var(--color-background);
  border: 1px solid var(--color-border-soft); border-radius: var(--radius); color: #CBD5E1;
  font: 400 12px/1.55 var(--font-head); white-space: pre-wrap; max-height: 320px; overflow: auto; }

.vlist { margin: var(--space-2) 0 0; display: grid; gap: var(--space-1); }
.vrow { display: flex; align-items: center; gap: var(--space-2); padding: 5px 8px;
  background: var(--color-muted); border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-sm); font-size: 12px; }
.vrow__ver { font-family: var(--font-head); color: var(--color-foreground); min-width: 52px; }
.vrow__date { font-family: var(--font-head); color: var(--color-muted-fg); }
.vrow__sp { flex: 1 1 auto; }

.file__dl { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; min-height: 26px;
  border: 1px solid var(--color-accent); border-radius: var(--radius-sm); color: var(--color-accent);
  font: 600 11.5px/1.2 var(--font-body); white-space: nowrap; }
.file__dl:hover { background: color-mix(in srgb, var(--color-accent) 18%, transparent); text-decoration: none; }
.file__pending { color: var(--color-muted-fg); font-size: 11.5px; white-space: nowrap; }
.links { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }

/* ── list view ─────────────────────────────────────────────────────────── */
.row { display: grid; align-items: center; gap: var(--space-3);
  grid-template-columns: minmax(0, 3fr) 78px 96px minmax(0, 1.4fr) 78px 70px 92px 132px;
  padding: 8px var(--space-4); border-bottom: 1px solid var(--color-border-soft); }
.row:hover { background: var(--color-surface); }
.row--head { position: sticky; top: 0; background: var(--color-background);
  border-bottom: 1px solid var(--color-border); font: 600 11px/1.4 var(--font-head);
  letter-spacing: .06em; text-transform: uppercase; color: var(--color-muted-fg); }
.row__name { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.row__name span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.row__num { font-family: var(--font-head); font-variant-numeric: tabular-nums;
  font-size: 12.5px; color: var(--color-muted-fg); }
.row__act { display: flex; justify-content: flex-end; gap: 6px; }
/* Verdict stays visible at every width - on a phone it is the column that matters. */
@media (max-width: 1100px) { .row { grid-template-columns: minmax(0, 1fr) 78px 96px 92px 132px; } .row__hide2 { display: none; } }
@media (max-width: 720px)  { .row { grid-template-columns: minmax(0, 1fr) 74px 124px; } .row__hide { display: none; } }

/* ── detail sheet ──────────────────────────────────────────────────────── */
.row__open { all: unset; cursor: pointer; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font: 400 13.5px/1.4 var(--font-body); color: var(--color-foreground); }
.row__open:hover { color: var(--color-info); text-decoration: underline; }
.row__open:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }

dialog.sheet { width: min(94vw, 820px); max-height: 90vh; padding: 0; overflow: hidden;
  border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  background: var(--color-surface); color: var(--color-foreground); box-shadow: var(--shadow-2); }
/* only style the OPEN state as flex - a bare `display:flex` beats the UA's
   `dialog:not([open]) { display: none }` and leaves the sheet stuck on screen */
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(2,6,23,.8); backdrop-filter: blur(3px); }
.sheet__bar { display: flex; align-items: center; gap: var(--space-3); flex: none;
  padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border-soft); }
.sheet__bar h2 { flex: 1; margin: 0; font-size: 15px; line-height: 1.3; }
.sheet__body { padding: var(--space-4); overflow: auto; display: grid; gap: var(--space-4);
  overscroll-behavior: contain; }   /* don't hand the scroll back to the page at the edges */
/* freeze the page behind the sheet, keeping the scroll position */
body.modal-open { overflow: hidden; }
.sect { display: grid; gap: var(--space-2); }
.sect > h3 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--color-muted-fg); }
.sect ol, .sect ul { margin: 0; padding-left: 20px; font-size: 13px; color: #CBD5E1; }
.sect ol li, .sect ul li { margin-bottom: 4px; }
.kvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-2); }
.kvcell { padding: 7px 10px; background: var(--color-muted); border: 1px solid var(--color-border-soft);
  border-radius: var(--radius); }
.kvcell dt { font-size: 11px; color: var(--color-muted-fg); }
.kvcell dd { margin: 2px 0 0; font-family: var(--font-head); font-variant-numeric: tabular-nums; font-size: 13px; }
.hint { font-size: 12px; color: var(--color-muted-fg); }

/* Silent staleness is the worst failure mode: a broken sync still serves a
   perfectly normal-looking page. Say it out loud instead. */
/* `display:flex` on the bare class beats the UA's `[hidden] { display: none }`,
   which left an empty amber bar on screen - scope it to the visible state. */
.stale[hidden] { display: none; }
.stale:not([hidden]) { display: flex; align-items: center; gap: var(--space-2); max-width: 1600px;
  margin: var(--space-3) auto 0; padding: var(--space-3) var(--space-4);
  background: color-mix(in srgb, var(--color-warn) 12%, var(--color-background));
  border: 1px solid color-mix(in srgb, var(--color-warn) 45%, transparent);
  border-radius: var(--radius); color: #FCD34D; font-size: 13px; }
.stale--bad { background: color-mix(in srgb, var(--color-destructive) 14%, var(--color-background));
  border-color: color-mix(in srgb, var(--color-destructive) 50%, transparent); color: #FCA5A5; }

/* live account panel - the agent URL and token live in this browser's
   localStorage only, never in the repo or the published page */
.mt5bar { max-width: 1600px; margin: var(--space-3) auto 0; padding: var(--space-3) var(--space-4);
  background: var(--color-surface); border: 1px solid var(--color-border-soft); border-radius: var(--radius-lg); }
.mt5bar__head { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.mt5bar__title { display: flex; align-items: center; gap: 6px; font-family: var(--font-head);
  font-weight: 600; font-size: 13px; }
.mt5bar__title svg { color: var(--color-accent); }
.mt5bar__stats { font-size: 12.5px; color: var(--color-muted-fg); }
.mt5bar__stats b { color: var(--color-foreground); font-family: var(--font-head); font-variant-numeric: tabular-nums; }
#mt5age { display: inline-flex; align-items: center; gap: 5px; }
#mt5age .led { width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); }
#mt5age .led--old { background: var(--color-muted-fg); }
.mt5bar__grid { display: grid; gap: var(--space-2); margin-top: var(--space-3);
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.mt5cell { padding: 7px 10px; background: var(--color-muted); border: 1px solid var(--color-border-soft);
  border-radius: var(--radius); }
.mt5cell dt { font-size: 11px; color: var(--color-muted-fg); }
.mt5cell dd { margin: 2px 0 0; font-family: var(--font-head); font-variant-numeric: tabular-nums; font-size: 14px; }
.mt5cell dd.pos { color: var(--color-accent); }
.mt5cell dd.neg { color: var(--color-destructive); }
.mt5sect { margin-top: var(--space-4); }
.mt5sect .empty { padding: var(--space-6) var(--space-4); }   /* not the 64px of the EA grid */
.mt5sect h2 { margin: 0 0 var(--space-2); font-size: 12px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--color-muted-fg); }
.wrap { overflow-x: auto; }
table.mt5 { width: 100%; border-collapse: collapse; background: var(--color-surface);
  border: 1px solid var(--color-border-soft); border-radius: var(--radius-lg); overflow: hidden; }
table.mt5 thead th { text-align: left; padding: 8px var(--space-3); background: var(--color-muted);
  font: 600 11px/1.4 var(--font-head); letter-spacing: .06em; text-transform: uppercase; color: var(--color-muted-fg); }
table.mt5 tbody td { padding: 8px var(--space-3); border-top: 1px solid var(--color-border-soft); font-size: 13px; }
table.mt5 tbody tr:hover { background: var(--color-surface-2); }
table.mt5 td.n, table.mt5 th.n { text-align: right; font-family: var(--font-head); font-variant-numeric: tabular-nums; }
.mt5rows { grid-column: 1 / -1; display: grid; gap: var(--space-1); }
.mt5row { display: flex; align-items: center; gap: var(--space-2); padding: 5px 9px; font-size: 12px;
  background: var(--color-muted); border: 1px solid var(--color-border-soft); border-radius: var(--radius-sm); }
.mt5row .sp { flex: 1 1 auto; }
.mt5row .num { color: var(--color-muted-fg); }

.empty { padding: 64px var(--space-4); text-align: center; color: var(--color-muted-fg); }
.empty h2 { margin: 0 0 var(--space-2); font-size: 16px; color: var(--color-foreground); }
.empty code { padding: 2px 6px; background: var(--color-muted); border-radius: var(--radius-sm);
  color: var(--color-foreground); font-family: var(--font-head); font-size: 12.5px; }
.more { display: flex; justify-content: center; padding: var(--space-6) 0 var(--space-8); }

footer { max-width: 1600px; margin: 0 auto; padding: 0 var(--space-4) var(--space-8);
  color: var(--color-muted-fg); font-size: 12px; }
@media (max-width: 640px) {
  .appbar__row, .toolbar { padding-inline: var(--space-3); }
  main { padding: var(--space-3); }
  .card { padding: var(--space-3); }
}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar__row">
    <span class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="7.5" stroke="#1E3A5F" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="3.6" stroke="#1E3A5F" stroke-width="1.4"/>
        <path d="M12 12L20.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="1.9" fill="currentColor"/>
      </svg>
      FX EA RADAR
    </span>

    <div class="segmented" role="tablist" aria-label="View">
      <button class="btn" id="tab-eas" role="tab" aria-selected="true">EA catalog</button>
      <button class="btn" id="tab-mt5" role="tab" aria-selected="false">My MT5</button>
    </div>

    <label class="search" id="search-box">
      <span class="sr-only">Search expert advisors</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="Search name, rules, filename, pair…" autocomplete="off">
    </label>

    <label class="sr-only" for="sort">Sort order</label>
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="verdict">Best tested first</option>
      <option value="old">Oldest first</option>
      <option value="versions">Most versions</option>
      <option value="name">Name A–Z</option>
    </select>

    <span class="syncbox" id="syncbox" role="status" aria-live="polite"></span>

  </div>

  <div class="toolbar" id="toolbar-eas">
    <div class="fgroup" role="group" aria-label="Quick filters">
      <button class="chip" id="f-pass" aria-pressed="false" title="#bestea - the channel's test made money">Passed test</button>
      <button class="chip" id="f-noloss" aria-pressed="false" title="hide EAs their own test lost money on">Hide losers</button>
      <button class="chip" id="f-img" aria-pressed="false">Has test</button>
      <button class="chip" id="f-fx" aria-pressed="false" title="only EAs with a Myfxbook account link">Myfxbook</button>
      <button class="chip" id="f-multi" aria-pressed="false">Multi-version</button>
    </div>

    <span class="fdiv" aria-hidden="true"></span>

    <label class="sr-only" for="pair">Filter by pair</label>
    <select id="pair"><option value="">All pairs</option></select>
    <label class="sr-only" for="tf">Filter by timeframe</label>
    <select id="tf"><option value="">All timeframes</option></select>

    <details class="popover" id="tagpop">
      <summary class="chip" id="tagsummary" aria-label="Filter by tag">Tags</summary>
      <div class="popover__panel" id="tagpanel"></div>
    </details>

    <button class="chip" id="clear" hidden>Clear filters</button>
    <span class="toolbar__spacer"></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
</header>

<p class="stale" id="stale" hidden></p>

<main>
  <div id="view-eas">
    <div class="grid grid--list" id="grid"></div>
    <div class="more" id="more"></div>
  </div>

  <div id="view-mt5" hidden>
    <section class="mt5bar">
      <div class="mt5bar__head">
        <span class="mt5bar__title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-7 4 4 6-8"/></svg>
          Account
        </span>
        <span class="mt5bar__stats" id="mt5stats">not connected</span>
        <span class="toolbar__spacer"></span>
        <span class="mt5bar__stats" id="mt5age"></span>
        <button class="chip" id="mt5conf" title="Change the agent URL or token">Connect</button>
      </div>
      <div class="mt5bar__grid" id="mt5grid" hidden></div>
    </section>

    <section class="mt5sect"><h2>Open positions <span class="num" id="mt5poscount"></span></h2>
      <div class="wrap" id="mt5positions"></div></section>
    <section class="mt5sect"><h2>By EA (magic number) <span class="num" id="mt5eacount"></span></h2>
      <div class="wrap" id="mt5byea"></div></section>
    <section class="mt5sect"><h2>Pending orders <span class="num" id="mt5ordcount"></span></h2>
      <div class="wrap" id="mt5orders"></div></section>
  </div>
</main>
<footer id="foot"></footer>

<dialog class="sheet" id="detail" aria-labelledby="detail-title">
  <div class="sheet__bar">
    <h2 id="detail-title">EA</h2>
    <a class="btn" id="detail-tg" href="#" target="_blank" rel="noopener"
       title="Open the original message in Telegram" aria-label="Open in Telegram">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.9 4.3 18.7 19c-.2 1-.9 1.3-1.8.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.4-4.9 8.6-7.8c.4-.3-.1-.5-.6-.2L6.9 12.7 2.6 11.4c-.9-.3-.9-.9.2-1.3l17.5-6.8c.8-.3 1.5.2 1.6 1z"/>
      </svg>
      Telegram
    </a>
    <button class="btn" id="detail-close" aria-label="Close details">Close</button>
  </div>
  <div class="sheet__body" id="detail-body"></div>
</dialog>

<script>
'use strict';
const PAGE = 60;                     // render in batches; hundreds of rows at once is not viable
const urlParams = new URLSearchParams(location.search);
const oneOf = (v, allowed, fallback) => (allowed.includes(v) ? v : fallback);

let POSTS = [], SUMMARY = {}, STATE = {}, SYNC = {};
let LOADED = { matched: 0, truncated: false, collapsed: 0 };
let visible = PAGE;

const filters = {
  q: urlParams.get('q') || '',
  pass: false, noloss: false, img: false, fx: false, multi: false,
  pair: '', tf: '', tags: new Set(), sort: 'new',
};

const ICON = {
  chevron: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  download: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M4 21h16"/></svg>',
  link: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7L11 7"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 1 0 11 18.7L13 17"/></svg>',
  chart: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
};
const RISKY = new Set(['cracked', 'martingale', 'grid']);
/* plumbing tags: they drive filters but are noise as badges */
const HIDDEN_TAGS = new Set(['has-archive', 'has-ea-file', 'has-set-file', 'template-ea', 'indicator', 'course']);
const visibleTags = p => (p.tags || []).filter(t => !HIDDEN_TAGS.has(t));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtSize = b => !b ? '' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const when = ts => {
  const days = (Date.now() / 1000 - ts) / 86400;
  return days < 1 ? Math.round(days * 24) + 'h ago' : days < 30 ? Math.round(days) + 'd ago' : Math.round(days / 30) + 'mo ago';
};

/* ── data ──────────────────────────────────────────────────────────────── */
const query = () => new URLSearchParams({ ea: '1', kind: 'ea', group: '1', limit: '3000' }).toString();

async function load() {
  const d = await (await fetch('/api/posts?' + query())).json();
  POSTS = d.posts || [];
  SUMMARY = d.summary || {};
  STATE = d.state || {};
  SYNC = d.sync || {};
  LOADED = { matched: d.matched ?? POSTS.length, truncated: !!d.truncated, collapsed: d.collapsed || 0 };
  fillSelect('pair', SUMMARY.pairs || []);
  fillSelect('tf', SUMMARY.timeframes || []);
  renderTagChips(SUMMARY.tags || []);
  visible = PAGE;
  render();
}

function fillSelect(id, values) {
  const el = document.getElementById(id), keep = el.value;
  el.length = 1;
  for (const v of values) el.add(new Option(v, v));
  el.value = values.includes(keep) ? keep : '';
}

/* ── filtering ─────────────────────────────────────────────────────────── */
function matches(p) {
  if (filters.pass && p.shot?.verdict !== 'pass') return false;
  if (filters.noloss && ['loss', 'scam'].includes(p.shot?.verdict)) return false;
  if (filters.img && !p.shot) return false;
  if (filters.fx && !p.shot?.myfxbook) return false;
  if (filters.multi && !((p.version_count || 1) > 1)) return false;
  if (filters.pair && !(p.pairs || []).includes(filters.pair)) return false;
  if (filters.tf && !(p.timeframes || []).includes(filters.tf)) return false;
  for (const t of filters.tags) if (!(p.tags || []).includes(t)) return false;
  if (filters.q) {
    const hay = [p.name, p.text_clean || p.text, (p.rules || []).join(' '),
      (p.files || []).map(f => f.name).join(' '), (p.versions || []).map(v => v.name).join(' '),
      (p.pairs || []).join(' '), (p.timeframes || []).join(' '), (p.tags || []).join(' ')].join(' ').toLowerCase();
    if (!filters.q.split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}

// passed > still testing > untested > no trades > lost > scam
const VERDICT_RANK = { pass: 5, undefined: 3, 'no-trade': 2, loss: 1, scam: 0 };
const verdictScore = p => (p.shot ? (VERDICT_RANK[p.shot.verdict] ?? 4) : 3);

const sorters = {
  new:      (a, b) => b.date - a.date,
  old:      (a, b) => a.date - b.date,
  verdict:  (a, b) => (verdictScore(b) - verdictScore(a)) || (b.date - a.date),
  versions: (a, b) => ((b.version_count || 1) - (a.version_count || 1)) || (b.date - a.date),
  name:     (a, b) => String(a.name).localeCompare(String(b.name)),
};

/* ── shared pieces ─────────────────────────────────────────────────────── */
const fileOf = p => (p.files || [])[0];
const extOf = f => (f?.name.match(/\.([a-z0-9]{2,4})$/i)?.[1] || 'file').toLowerCase();

function downloadBtn(p) {
  const f = fileOf(p);
  if (!f) return '<span class="file__pending">no file</span>';
  if (f.local_path) {
    return `<a class="file__dl" href="/files/${encodeURI(f.local_path)}" download title="${esc(f.name)}">
      ${ICON.download} .${extOf(f)} · ${fmtSize(f.size_bytes)}</a>`;
  }
  // static build (or not downloaded yet): send the user to the post itself
  if (f.tg_url) {
    return `<a class="file__dl" href="${esc(f.tg_url)}" target="_blank" rel="noopener" title="${esc(f.name)}">
      ${ICON.link} .${extOf(f)} · ${fmtSize(f.size_bytes)}</a>`;
  }
  return `<span class="file__pending" title="${esc(f.name)}">.${extOf(f)} · ${fmtSize(f.size_bytes)} · pending</span>`;
}

/* Live-account links from the test post. Myfxbook first - it is the verifiable one. */
function testLinks(p, compact) {
  const s = p.shot;
  if (!s) return '<span class="shot-none">—</span>';
  const out = [];
  if (s.myfxbook) out.push(`<a class="tlink" href="${esc(s.myfxbook)}" target="_blank" rel="noopener noreferrer"
      title="Myfxbook account for ${esc(s.source_name || p.name)}">${ICON.chart} Myfxbook</a>`);
  if (!compact && s.mystatea) out.push(`<a class="tlink" href="${esc(s.mystatea)}" target="_blank" rel="noopener noreferrer">${ICON.link} MyStatEA</a>`);
  if (!compact && s.report) out.push(`<a class="tlink" href="${esc(s.report)}" target="_blank" rel="noopener noreferrer">${ICON.link} Report</a>`);
  if (!out.length) {
    return s.url
      ? `<a class="tlink" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${ICON.link} test post</a>`
      : '<span class="shot-none">—</span>';
  }
  return out.join(compact ? '' : ' ');
}

/* ROBOTEST verdict, stated as a hashtag on the test post */
const VERDICT = {
  pass:       { cls: 'badge--pass', label: 'passed',   title: '#bestea - the channel\'s own test made money' },
  loss:       { cls: 'badge--loss', label: 'lost',     title: '#lossea - the test lost money' },
  scam:       { cls: 'badge--scam', label: 'scam',     title: '#scamea - flagged as a scam' },
  'no-trade': { cls: 'badge--none', label: 'no trades', title: '#notradeea - the EA never opened a trade' },
};
function verdictBadge(p) {
  if (!p.shot) return '';
  const v = VERDICT[p.shot.verdict];
  if (v) return `<span class="badge ${v.cls}" title="${esc(v.title)}">${v.label}</span>`;
  return `<span class="badge badge--run" title="test still running${p.shot.test_until ? ', until ' + esc(p.shot.test_until) : ''}">testing</span>`;
}


/* ── detail sheet + list row ────────────────────────────────────────────── */

function detailHtml(p) {
  const vs = p.versions || [];
  const specs = [['Pairs', (p.pairs || []).join(', ')], ['Timeframe', (p.timeframes || []).join(', ')],
    ['Min deposit', p.deposit], ['Leverage', p.leverage], ['Lot', p.lot], ['Risk', p.risk],
    ['Account', p.account_type], ['Password', p.password],
    ['Platform', (p.tags || []).filter(t => t === 'mt4' || t === 'mt5').join(' / ')],
  ].filter(([, v]) => v && String(v).trim());

  const ownSteps = p.install || [];
  const s = p.shot;

  return `
    ${specs.length ? `<section class="sect"><h3>Specification</h3>
      <div class="kvgrid">${specs.map(([k, v]) => `<dl class="kvcell"><dt>${k}</dt><dd>${esc(v)}</dd></dl>`).join('')}</div>
    </section>` : ''}

    <section class="sect"><h3>Download</h3>
      <div class="tlinks">${(p.files || []).map(f => f.local_path
        ? `<a class="file__dl" href="/files/${encodeURI(f.local_path)}" download>${ICON.download} Download ${esc(f.name)} · ${fmtSize(f.size_bytes)}</a>`
        : (f.tg_url || p.url)
          ? `<a class="file__dl" href="${esc(f.tg_url || p.url)}" target="_blank" rel="noopener">${ICON.download} Get ${esc(f.name)} · ${fmtSize(f.size_bytes)} · via Telegram</a>`
          : `<span class="file__pending">${esc(f.name)} · ${fmtSize(f.size_bytes)} · not downloaded</span>`).join('')
        || '<span class="hint">No attachment on this post.</span>'}</div>
    </section>

    ${ownSteps.length ? `<section class="sect"><h3>Setup notes from the post</h3>
      <ul>${ownSteps.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}

    ${visibleTags(p).length ? `<section class="sect"><h3>Tags</h3>
      <div class="badges">${visibleTags(p).map(t => `<span class="badge${RISKY.has(t) ? ' badge--risk' : ''}">${esc(t)}</span>`).join('')}</div>
    </section>` : ''}

    ${(p.rules || []).length ? `<section class="sect"><h3>Rules &amp; settings from the post</h3>
      <ul>${p.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></section>` : ''}

    ${s ? `<section class="sect"><h3>Channel test</h3>
      <p class="hint">${s.status === 'completed' ? 'Completed' : 'Still running'}${s.source_name ? ' · tested as ' + esc(s.source_name) : ''}${s.test_until ? ' · until ' + esc(s.test_until) : ''}${s.same_version === false ? ' · a different version than this download' : ''}</p>
      <div class="tlinks">${testLinks(p, false)}</div>
    </section>` : ''}

    ${vs.length > 1 ? `<section class="sect"><h3>Versions (${vs.length})</h3>
      <div class="vlist">${vs.map(v => {
        const f = (v.files || [])[0];
        return `<div class="vrow">
          <span class="vrow__ver">${esc(v.version || '—')}</span>
          <span class="vrow__date">${esc(v.date_iso)}</span>
          <span class="vrow__sp"></span>
          ${f?.local_path ? `<a class="file__dl" href="/files/${encodeURI(f.local_path)}" download>${ICON.download} ${fmtSize(f.size_bytes)}</a>` : '<span class="file__pending">no file</span>'}
          ${v.url ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">post</a>` : ''}
        </div>`;
      }).join('')}</div></section>` : ''}

    ${(() => {
      // Links already surfaced elsewhere (test post, report) are noise here. What is
      // left is nearly always a URL the EA calls and needs allowed in MetaTrader.
      const shown = (p.links || []).filter(l => !/t\.me|myfxbook|mystatea|pro-fx\.cc/i.test(l));
      if (!shown.length) return '';
      return `<section class="sect"><h3>URLs the EA calls</h3>
        <p class="hint">Add these under Tools → Options → Expert Advisors → Allow WebRequest, or the EA
        may refuse to trade. They also mean it phones home.</p>
        <div class="links">${shown.map(l => `<a href="${esc(l)}" target="_blank" rel="noopener noreferrer">${ICON.link} ${esc(l)}</a>`).join('')}</div>
      </section>`;
    })()}

    <section class="sect"><h3>Original message</h3>
      <pre class="raw">${esc(p.text_clean || p.text || '(no text)')}</pre>
      ${p.url ? `<p class="hint"><a href="${esc(p.url)}" target="_blank" rel="noopener">Open in Telegram</a> · posted ${esc(p.date_iso.slice(0, 10))}</p>` : ''}
    </section>`;
}

const detailDlg = document.getElementById('detail');
function openDetail(key) {
  const p = POSTS.find(x => (x.family || x.dedupe_key || x.key) === key);
  if (!p) return;
  document.getElementById('detail-title').textContent = p.name + (p.version ? ' · ' + p.version : '');
  const tg = document.getElementById('detail-tg');
  tg.hidden = !p.url;
  if (p.url) tg.href = p.url;
  document.getElementById('detail-body').innerHTML = detailHtml(p);
  detailDlg.showModal();
  document.getElementById('detail-body').scrollTop = 0;
  document.body.classList.add('modal-open');
}
document.getElementById('detail-close').onclick = () => detailDlg.close();
detailDlg.addEventListener('click', e => { if (e.target === detailDlg) detailDlg.close(); });
// 'close' also fires on Esc, so the lock is released on every exit path
detailDlg.addEventListener('close', () => document.body.classList.remove('modal-open'));

function row(p) {
  const n = p.version_count || 1;
  const chips = (p.pairs || []).slice(0, 2).map(x => `<span class="badge badge--pair">${esc(x)}</span>`).join('')
    + (p.timeframes || []).slice(0, 1).map(x => `<span class="badge badge--tf">${esc(x)}</span>`).join('');
  return `<div class="row">
    <div class="row__name">
      <button class="row__open" data-key="${esc(p.family || p.dedupe_key || p.key)}"
        title="${esc(p.name)} - click for full details">${esc(p.name)}</button>
      ${p.version ? `<span class="badge badge--ver">${esc(p.version)}</span>` : ''}
    </div>
    <div>${verdictBadge(p) || '<span class="shot-none">—</span>'}</div>
    <div class="row__hide">${testLinks(p, true)}</div>
    <div class="badges row__hide2">${chips}</div>
    <div class="row__num row__hide2">${esc(p.deposit || '—')}</div>
    <div class="row__num row__hide2">${n > 1 ? n + ' vers' : '—'}</div>
    <div class="row__num row__hide">${esc(p.date_iso.slice(0, 10))}</div>
    <div class="row__act">${downloadBtn(p)}</div>
  </div>`;
}

function render() {
  const list = POSTS.filter(matches).sort(sorters[filters.sort] || sorters.new);
  const page = list.slice(0, visible);
  const grid = document.getElementById('grid');

  grid.innerHTML = !page.length ? emptyState()
    : `<div class="row row--head">
        <div>Name</div><div>Test</div><div class="row__hide">Myfxbook</div>
        <div class="row__hide2">Pairs / TF</div><div class="row__hide2">Deposit</div>
        <div class="row__hide2">Versions</div><div class="row__hide">Posted</div>
        <div style="text-align:right">File</div>
      </div>` + page.map(row).join('');
  wireCards();

  const moreBox = document.getElementById('more');
  moreBox.innerHTML = list.length > page.length
    ? `<button class="btn" id="load-more">Show ${Math.min(PAGE, list.length - page.length)} more
         <span class="num">(${page.length}/${list.length})</span></button>` : '';
  const btn = document.getElementById('load-more');
  if (btn) btn.onclick = () => { visible += PAGE; render(); };

  const passed = POSTS.filter(p => p.shot?.verdict === 'pass').length;
  const lost = POSTS.filter(p => ['loss', 'scam'].includes(p.shot?.verdict)).length;
  const testing = POSTS.filter(p => p.shot && !p.shot.verdict).length;
  document.getElementById('status').innerHTML =
    `<b>${list.length}</b> EAs`
    + (LOADED.collapsed ? ` · <b>${LOADED.collapsed}</b> grouped` : '')
    + ` · <b>${passed}</b> passed · <b>${lost}</b> lost · <b>${testing}</b> testing`
    + (LOADED.truncated ? ` · <span class="warn">newest 3000 loaded</span>` : '');
  syncFilterUi();
  renderSync();
  renderStaleness();

  const chans = (SUMMARY.channels || []).join(', ') || '—';
  const last = STATE.last_sync ? new Date(STATE.last_sync).toLocaleString() : 'never';
  const shots = SYNC.shots_result;
  const shotsPart = SYNC.shots_at
    ? ` · verdicts refreshed ${ago(SYNC.shots_at)}${shots?.total ? ` (${shots.total} tests)` : ''}`
    : ' · verdicts not refreshed yet this run';
  document.getElementById('foot').textContent =
    `Channel: ${chans} · last sync ${last} · ${SUMMARY.total || 0} messages stored${shotsPart}`
    + (SYNC.shots_error ? ` · verdict refresh error: ${SYNC.shots_error}` : '')
    + ((STATE.errors || []).length ? ` · errors: ${STATE.errors.join(' | ')}` : '');
}

function emptyState() {
  if (!SUMMARY.total) {
    return `<div class="empty"><h2>Nothing collected yet</h2>
      <p>Run <code>.\\run.ps1 login</code> then <code>.\\run.ps1 sync</code>, or press <b>Sync</b> above.</p></div>`;
  }
  return `<div class="empty"><h2>No match</h2>
    <p>No EA matches these filters. Clear the search box or switch off a chip.</p></div>`;
}

function wireCards() {
  document.querySelectorAll('.row__open').forEach(b => b.onclick = () => openDetail(b.dataset.key));
}

/* ── tag dropdown ──────────────────────────────────────────────────────── */
function renderTagChips(tags) {
  const useful = tags.filter(t => !HIDDEN_TAGS.has(t));
  const counts = {};
  for (const p of POSTS) for (const t of p.tags || []) counts[t] = (counts[t] || 0) + 1;
  const present = useful.filter(t => counts[t]);

  document.getElementById('tagpanel').innerHTML = present.length
    ? present.map(t => `<label class="tagopt" data-on="${filters.tags.has(t)}">
        <input type="checkbox" data-tag="${esc(t)}" ${filters.tags.has(t) ? 'checked' : ''}>
        <span>${esc(t)}</span><span class="n">${counts[t]}</span></label>`).join('')
    : '<p class="tagopt">No tags in this view</p>';

  document.querySelectorAll('#tagpanel input[data-tag]').forEach(cb => cb.onchange = () => {
    const t = cb.dataset.tag;
    cb.checked ? filters.tags.add(t) : filters.tags.delete(t);
    cb.closest('.tagopt').dataset.on = String(cb.checked);
    visible = PAGE;
    render();
  });
  syncFilterUi();
}

const activeFilterCount = () => filters.tags.size + (filters.pair ? 1 : 0) + (filters.tf ? 1 : 0)
  + (filters.pass ? 1 : 0) + (filters.noloss ? 1 : 0) + (filters.img ? 1 : 0)
  + (filters.fx ? 1 : 0) + (filters.multi ? 1 : 0) + (filters.q ? 1 : 0);

function syncFilterUi() {
  const n = filters.tags.size;
  const sum = document.getElementById('tagsummary');
  sum.textContent = n ? `Tags · ${n}` : 'Tags';
  sum.setAttribute('aria-pressed', String(n > 0));
  document.getElementById('clear').hidden = activeFilterCount() === 0;
}

function clearFilters() {
  filters.tags.clear();
  filters.pair = filters.tf = filters.q = '';
  filters.pass = filters.noloss = filters.img = filters.fx = filters.multi = false;
  document.getElementById('q').value = '';
  document.getElementById('pair').value = '';
  document.getElementById('tf').value = '';
  for (const id of ['f-pass', 'f-noloss', 'f-img', 'f-fx', 'f-multi']) document.getElementById(id).setAttribute('aria-pressed', 'false');
  document.querySelectorAll('#tagpanel input[data-tag]').forEach(cb => { cb.checked = false; cb.closest('.tagopt').dataset.on = 'false'; });
  visible = PAGE;
  render();
}

/* ── controls ──────────────────────────────────────────────────────────── */
document.getElementById('q').oninput = e => { filters.q = e.target.value.trim().toLowerCase(); visible = PAGE; render(); };
document.getElementById('sort').onchange = e => { filters.sort = e.target.value; render(); };
document.getElementById('pair').onchange = e => { filters.pair = e.target.value; visible = PAGE; render(); };
document.getElementById('tf').onchange = e => { filters.tf = e.target.value; visible = PAGE; render(); };

for (const [id, key] of [['f-pass', 'pass'], ['f-noloss', 'noloss'], ['f-img', 'img'], ['f-fx', 'fx'], ['f-multi', 'multi']]) {
  document.getElementById(id).onclick = e => {

    visible = PAGE;
    render();
  };
}

if (filters.q) document.getElementById('q').value = filters.q;

document.getElementById('clear').onclick = clearFilters;

document.addEventListener('click', e => {
  const pop = document.getElementById('tagpop');
  if (pop.open && !pop.contains(e.target)) pop.open = false;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const pop = document.getElementById('tagpop');
  if (pop.open) { pop.open = false; document.getElementById('tagsummary').focus(); }
});

/* ── sync status (auto-sync only; there is no manual trigger) ───────────── */
function ago(iso) {
  if (!iso) return null;
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  if (mins < 1) return 'just now';
  if (mins < 60) return Math.round(mins) + 'm ago';
  if (mins < 48 * 60) return Math.round(mins / 60) + 'h ago';
  return Math.round(mins / 1440) + 'd ago';
}
function until(iso) {
  if (!iso) return null;
  const mins = (new Date(iso).getTime() - Date.now()) / 60000;
  if (mins <= 0) return 'due';
  return mins < 60 ? 'in ' + Math.round(mins) + 'm' : 'in ' + Math.round(mins / 60) + 'h';
}

/* The sync runs twice a day, so ~30h without one means something is broken:
   an expired Telegram session, a disabled cron, or a failing workflow. */
const STALE_WARN_H = 30;
const STALE_BAD_H = 72;

function renderStaleness() {
  const box = document.getElementById('stale');
  const last = STATE.last_sync;
  if (!last || TAB !== 'eas') { box.hidden = true; return; }   // catalog-only notice
  const hours = (Date.now() - new Date(last).getTime()) / 3600000;
  if (hours < STALE_WARN_H) { box.hidden = true; return; }

  const bad = hours >= STALE_BAD_H;
  box.hidden = false;
  box.classList.toggle('stale--bad', bad);
  const age = hours < 48 ? `${Math.round(hours)} hours` : `${Math.round(hours / 24)} days`;
  box.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/></svg>
    <span><b>Data is ${esc(age)} old.</b> The sync normally runs twice a day, so it is probably failing
    — check the Actions tab, or the Telegram session may need renewing. New EAs are missing from this list.</span>`;
}

function renderSync() {
  const s = SYNC || {};
  const box = document.getElementById('syncbox');
  const last = STATE.last_sync;
  const lastAge = (Date.now() - new Date(last || 0).getTime()) / 3600000;

  let led = 'led', text;
  if (s.running) {
    led = 'led led--run';
    text = 'Syncing…';
  } else if (s.last_error) {
    led = 'led led--err';
    text = 'Sync failed';
  } else if (!last) {
    led = 'led led--old';
    text = 'Never synced';
  } else {
    if (lastAge > 26) led = 'led led--old';
    text = `Synced ${ago(last)}`;
    const nxt = until(s.next_at);
    if (nxt) text += ` · next ${nxt}`;
  }
  const tip = s.last_error ? s.last_error
    : last ? `last sync ${new Date(last).toLocaleString()}` + (s.next_at ? `, next ${new Date(s.next_at).toLocaleString()}` : '')
    : 'the server syncs on start and every SYNC_INTERVAL_MIN minutes';
  box.innerHTML = `<span class="${led}"></span><span>${esc(text)}</span>`;
  box.title = tip;
}

/* ── live MT5 panel ────────────────────────────────────────────────────────
   Talks straight from your browser to the agent on your VPS. The URL and token
   are kept in localStorage, so the published page never carries them and your
   account data never passes through GitHub.                                  */
const MT5_KEY = 'mt5_conf';
let MT5 = JSON.parse(localStorage.getItem(MT5_KEY) || 'null');

// Exponential backoff: when the agent is down, stop hammering it every 10s.
// 20s, 40s, 80s ... capped at 5 min. Reset on the first success.
const mt5Backoff = { fails: 0, until: 0 };
const mt5Fail = () => {
  mt5Backoff.fails++;
  mt5Backoff.until = Date.now() + Math.min(300000, 10000 * 2 ** mt5Backoff.fails);
};
const mt5Ok = () => { mt5Backoff.fails = 0; mt5Backoff.until = 0; };

/* "updated just now" was noise once streaming landed - it always said that. What
   still matters is whether data is flowing, so this shows a live dot instead and
   only turns wordy when frames stop arriving. */
/* Two different clocks, and conflating them was a bug:
   - mt5LastActivity: any byte from the agent, INCLUDING the 20s heartbeat. This is
     what "live" means. A silent stream is healthy - it only speaks when something
     changes - so counting data frames alone showed "no data for 53s" while fine.
   - mt5LastData: last actual snapshot, used to age the numbers on screen. */
let mt5LastActivity = 0;
let mt5LastData = 0;

function renderMt5Freshness() {
  const el = document.getElementById('mt5age');
  if (!mt5LastActivity) { el.textContent = ''; return; }
  const quiet = (Date.now() - mt5LastActivity) / 1000;
  const dataAge = (Date.now() - mt5LastData) / 1000;
  const fmt = s => (s < 120 ? Math.round(s) + 's' : Math.round(s / 60) + 'm');

  if (quiet < 45) {
    el.innerHTML = `<span class="led"></span>${mt5Stream ? 'live' : 'polling'}`
      + (dataAge > 90 ? ` · unchanged ${fmt(dataAge)}` : '');
  } else {
    el.innerHTML = `<span class="led led--old"></span>agent quiet ${fmt(quiet)}`;
  }
}

// One-shot setup from the address bar: ?mt5=<agent-url>&mt5token=<token>
// Saved to localStorage, then stripped from the URL so the token is not left in
// the address bar or in history.
(() => {
  const u = urlParams.get('mt5'), t = urlParams.get('mt5token');
  if (!u) return;
  MT5 = { url: u.trim().replace(/\/+$/, ''), token: (t || MT5?.token || '').trim() };
  localStorage.setItem(MT5_KEY, JSON.stringify(MT5));
  const clean = new URL(location.href);
  clean.searchParams.delete('mt5');
  clean.searchParams.delete('mt5token');
  history.replaceState({}, '', clean);
})();

const mt5Money = (v, c) => v == null ? '—'
  : Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (c ? ' ' + c : '');
const mt5Cls = v => v == null || Number(v) === 0 ? '' : Number(v) > 0 ? 'pos' : 'neg';

document.getElementById('mt5conf').onclick = () => {
  const url = prompt('Agent URL (from cloudflared on the VPS):', MT5?.url || 'https://xxx.trycloudflare.com');
  if (url === null) return;
  const token = prompt('Access token (MT5_TOKEN on the VPS):', MT5?.token || '');
  if (token === null) return;
  MT5 = { url: url.trim().replace(/\/+$/, ''), token: token.trim() };
  localStorage.setItem(MT5_KEY, JSON.stringify(MT5));
  loadMt5();
};

async function loadMt5() {
  // Three reasons to skip a poll, all of them free: wrong tab, page not visible
  // (phone in pocket, other browser tab), or backing off after failures.
  if (TAB !== 'mt5') return;
  if (document.visibilityState === 'hidden') return;
  if (mt5Backoff.until > Date.now()) return;
  // While streaming, still take a snapshot occasionally: an open-but-silent stream
  // must never be able to hide a change (a new order appearing, for instance).
  if (mt5Stream && Date.now() - mt5LastData < 30000) return;

  const stats = document.getElementById('mt5stats');
  const grid = document.getElementById('mt5grid');
  // shown by default; hidden again only once a read actually succeeds
  document.getElementById('mt5conf').hidden = false;
  if (!MT5?.url || !MT5?.token) {
    stats.textContent = 'not connected — press Connect, or open the setup link from install_public.ps1';
    grid.hidden = true;
    return;
  }

  let d;
  try {
    const r = await fetch(MT5.url + '/api/mt5', { headers: { Authorization: 'Bearer ' + MT5.token } });
    if (r.status === 401) { stats.textContent = 'token rejected by the agent'; grid.hidden = true; mt5Fail(); return; }
    // A web page instead of JSON almost always means the dashboard URL was pasted
    // where the agent URL belongs - say that instead of a parser error.
    if (!(r.headers.get('content-type') || '').includes('json')) {
      mt5Fail();
      stats.textContent = `that URL returned a web page, not the agent (HTTP ${r.status}). `
        + 'Press Connect and use the agent address, e.g. https://mt5.<your-domain>';
      grid.hidden = true;
      return;
    }
    d = await r.json();
  } catch (e) {
    mt5Fail();
    const wait = Math.round((mt5Backoff.until - Date.now()) / 1000);
    stats.textContent = `agent unreachable — ${e.message} (retrying in ${wait}s)`;
    grid.hidden = true;
    return;
  }
  if (!d.ok) { stats.textContent = 'agent: ' + (d.error || 'unknown error'); grid.hidden = true; mt5Fail(); return; }
  mt5Ok();
  renderMt5(d);
}

function renderMt5(d) {
  const stats = document.getElementById('mt5stats');
  const grid = document.getElementById('mt5grid');
  if (!d.ok) { stats.textContent = 'agent: ' + (d.error || 'unknown error'); grid.hidden = true; return; }

  const a = d.account, t = d.terminal, cur = a.currency || '';
  stats.innerHTML = `<b>${esc(String(a.login))}</b> @ ${esc(a.server)} · ${a.is_demo ? 'demo' : 'live'}`
    + ` · ${t.connected ? 'connected' : '<span style="color:var(--color-destructive)">disconnected</span>'}`
    + ` · AutoTrading ${t.trade_allowed ? 'on' : '<span style="color:var(--color-warn)">off</span>'}`;

  const cells = [
    ['Equity', mt5Money(a.equity, cur), ''],
    ['Balance', mt5Money(a.balance, cur), ''],
    ['Floating', mt5Money(a.profit, cur), mt5Cls(a.profit)],
    ['Free margin', mt5Money(a.margin_free, cur), ''],
    ['Positions', String(d.totals.positions), ''],
    ['Pending', String(d.totals.orders), ''],
  ].map(([k, v, c]) => `<dl class="mt5cell"><dt>${k}</dt><dd class="${c}">${esc(v)}</dd></dl>`).join('');

  grid.hidden = false;
  grid.innerHTML = cells;
  mt5LastActivity = mt5LastData = Date.now();
  renderMt5Freshness();
  // connected and reading fine: the button is only clutter now
  document.getElementById('mt5conf').hidden = true;

  const pos = d.positions || [];
  document.getElementById('mt5poscount').textContent = pos.length ? `(${pos.length})` : '';
  document.getElementById('mt5positions').innerHTML = pos.length ? `<table class="mt5">
    <thead><tr><th>Symbol</th><th>Side</th><th class="n">Lots</th><th class="n">Entry</th><th class="n">Now</th>
      <th class="n">SL</th><th class="n">TP</th><th class="n">P&amp;L</th><th class="n">Magic</th><th>Comment</th></tr></thead>
    <tbody>${pos.map(p => `<tr>
      <td>${esc(p.symbol)}</td>
      <td><span class="badge ${p.type === 'buy' ? 'badge--pass' : 'badge--loss'}">${esc(p.type)}</span></td>
      <td class="n">${esc(p.volume)}</td><td class="n">${esc(p.price_open)}</td><td class="n">${esc(p.price_current)}</td>
      <td class="n">${p.sl ? esc(p.sl) : '—'}</td><td class="n">${p.tp ? esc(p.tp) : '—'}</td>
      <td class="n ${mt5Cls(p.profit)}">${mt5Money(p.profit, '')}</td>
      <td class="n">${esc(p.magic)}</td><td>${esc(p.comment || '')}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">No open positions.</div>';

  const eas = d.by_ea || [];
  document.getElementById('mt5eacount').textContent = eas.length ? `(${eas.length})` : '';
  document.getElementById('mt5byea').innerHTML = eas.length ? `<table class="mt5">
    <thead><tr><th class="n">Magic</th><th>Symbols</th><th class="n">Positions</th><th class="n">Lots</th>
      <th class="n">P&amp;L</th><th>Comment</th></tr></thead>
    <tbody>${eas.map(e => `<tr><td class="n">${esc(e.magic)}</td><td>${esc((e.symbols || []).join(', '))}</td>
      <td class="n">${esc(e.positions)}</td><td class="n">${esc(e.volume)}</td>
      <td class="n ${mt5Cls(e.profit)}">${mt5Money(e.profit, '')}</td>
      <td>${esc((e.comments || []).join(', '))}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">EAs appear here once they hold a position.</div>';

  const ords = d.orders || [];
  document.getElementById('mt5ordcount').textContent = ords.length ? `(${ords.length})` : '';
  document.getElementById('mt5orders').innerHTML = ords.length ? `<table class="mt5">
    <thead><tr><th>Symbol</th><th>Type</th><th class="n">Lots</th><th class="n">Price</th><th class="n">SL</th>
      <th class="n">TP</th><th class="n">Magic</th><th>Comment</th><th>Placed</th></tr></thead>
    <tbody>${ords.map(o => `<tr><td>${esc(o.symbol)}</td><td>${esc(o.type)}</td><td class="n">${esc(o.volume)}</td>
      <td class="n">${esc(o.price_open)}</td><td class="n">${o.sl ? esc(o.sl) : '—'}</td>
      <td class="n">${o.tp ? esc(o.tp) : '—'}</td><td class="n">${esc(o.magic)}</td>
      <td>${esc(o.comment || '')}</td>
      <td>${esc((o.placed_at || '').slice(0, 16).replace('T', ' '))}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">No pending orders.</div>';
}

/* ── tabs ──────────────────────────────────────────────────────────────── */
const TAB_KEY = 'fxea_tab';
let TAB = oneOf(urlParams.get('tab'), ['eas', 'mt5'], localStorage.getItem(TAB_KEY) || 'eas');

function showTab(name) {
  TAB = name;
  localStorage.setItem(TAB_KEY, name);
  const isEas = name === 'eas';
  document.getElementById('view-eas').hidden = !isEas;
  document.getElementById('view-mt5').hidden = isEas;
  // Channel/sync footer and the EA staleness banner both describe the catalog,
  // so they have no business on the MT5 tab.
  document.getElementById('toolbar-eas').hidden = !isEas;
  document.getElementById('foot').hidden = !isEas;
  document.getElementById('search-box').hidden = !isEas;   // searches the catalog only
  document.getElementById('sort').hidden = !isEas;
  document.getElementById('syncbox').hidden = !isEas;      // catalog sync clock, not MT5's
  if (!isEas) document.getElementById('stale').hidden = true;
  document.getElementById('tab-eas').setAttribute('aria-selected', String(isEas));
  document.getElementById('tab-mt5').setAttribute('aria-selected', String(!isEas));
  document.getElementById('tab-eas').setAttribute('aria-pressed', String(isEas));
  document.getElementById('tab-mt5').setAttribute('aria-pressed', String(!isEas));
  if (!isEas) loadMt5();
}
document.getElementById('tab-eas').onclick = () => showTab('eas');
document.getElementById('tab-mt5').onclick = () => showTab('mt5');
showTab(TAB);

/* ── real-time stream ──────────────────────────────────────────────────────
   One SSE connection instead of a request every 10s: the agent pushes a snapshot
   only when the account actually changes, so updates arrive in about a second and
   idle costs a heartbeat every 20s. Falls back to polling if streaming fails. */
let mt5Stream = null;

function stopMt5Stream() {
  if (mt5Stream) { mt5Stream.abort(); mt5Stream = null; }
}

async function startMt5Stream() {
  stopMt5Stream();
  if (TAB !== 'mt5' || !MT5?.url || !MT5?.token) return false;

  const ctl = new AbortController();
  mt5Stream = ctl;
  try {
    const r = await fetch(MT5.url + '/api/stream', {
      headers: { Authorization: 'Bearer ' + MT5.token },
      signal: ctl.signal,
    });
    if (!r.ok || !r.body) throw new Error('stream unavailable (' + r.status + ')');

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    mt5Ok();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      mt5LastActivity = Date.now();                // heartbeats count as alive
      renderMt5Freshness();
      // frames are separated by a blank line
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = frame.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;                       // ": ping" heartbeat
        try { renderMt5(JSON.parse(line.slice(6))); } catch { /* partial frame */ }
      }
    }
    return true;
  } catch (e) {
    if (ctl.signal.aborted) return true;           // we closed it on purpose
    console.warn('MT5 stream failed, falling back to polling:', e.message);
    return false;
  } finally {
    if (mt5Stream === ctl) mt5Stream = null;
  }
}

// Keep the connection only while the tab is open and the page visible.
async function syncMt5Transport() {
  if (TAB !== 'mt5' || document.visibilityState === 'hidden') {
    stopMt5Stream();
    return;
  }
  loadMt5();                                        // paint immediately
  const streamed = await startMt5Stream();          // resolves when the stream ends
  if (TAB !== 'mt5' || document.visibilityState === 'hidden') return;
  // Reconnect either way: on a clean end immediately, after a failure with a short
  // delay. Without this a dropped stream left the page silent until the next poll.
  setTimeout(syncMt5Transport, streamed ? 500 : 5000);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { mt5Ok(); syncMt5Transport(); }
  else stopMt5Stream();
});

syncMt5Transport();
setInterval(loadMt5, 10000);       // fallback only: skipped while a stream is live
setInterval(renderMt5Freshness, 5000);   // turns wordy only if frames stop

load();
// The catalog is rebuilt twice a day, so re-fetching every 2 min was pointless
// traffic; 10 min still shows a new sync well before you would notice.
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 600000);
setInterval(renderSync, 30000);  // keep the "x ago / next in" text honest
</script>
