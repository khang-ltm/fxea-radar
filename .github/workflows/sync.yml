name: build and publish

# Builds the MT5 control panel and publishes it. The EA catalog and MQL5 Market
# tabs were shut down on 2026-10-23, and with them the twice-daily schedule that
# only existed to sync the Telegram catalog and crawl the Market. The code for
# both (app/sync.py, app/sync_shots.py, app/mql5_market.py) is kept, dormant.
on:
  workflow_dispatch:            # manual run button in the Actions tab
  push:                         # code change -> rebuild and republish right away
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "requirements.txt"
      - ".github/workflows/sync.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fxea-sync
  cancel-in-progress: false     # let a publish finish before the next one starts

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read inside an `if:`, so mirror them into env here
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        env:
          # set repo variable PAGES_DOMAIN (e.g. fxea-radar.linkpc.net) AFTER the
          # DNS record exists - Pages redirects the github.io URL once it is set
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          # agent hostname baked into the page so only the token is ever asked for
          MT5_AGENT_URL: ${{ vars.MT5_AGENT_URL }}
        run: python -m app.export_static

      # Always downloadable from the run page, whatever hosting is set up.
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: fxea-site
          path: site
          retention-days: 30

      # Option 1 - Cloudflare Pages: free, works with a PRIVATE repo, and can be
      # locked to your email with Cloudflare Access. Runs only once the two
      # secrets exist, so it stays inert until you set them up.
      - name: Publish to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=fxea-radar --branch=main

      # Option 2 - GitHub Pages: needs a PUBLIC repo on the free plan. Enable by
      # setting repo variable ENABLE_GH_PAGES=true (Settings -> Variables).
      - name: Configure GitHub Pages
        if: ${{ vars.ENABLE_GH_PAGES == 'true' }}
        uses: actions/configure-pages@v6
        with:
          enablement: true          # turn Pages on for the repo if it is not yet
      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_GH_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: sync
    if: ${{ vars.ENABLE_GH_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
